<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let secret = Math.floor(Math.random() * 100) + 1;
        let essais = 0;
        let nombre;

        while (nombre != secret) {
            nombre = Number(prompt("Devine un nombre entre 1 et 100"));
            essais++;

            if (nombre < secret) {
                alert("C'est plus grand !");
            } else if (nombre > secret) {
                alert("C'est plus petit !");
            } else {
                alert("Bravo ! Tu as gagné en " + essais + " essais !");
            }
        }
    </script>
</body>
</html>
